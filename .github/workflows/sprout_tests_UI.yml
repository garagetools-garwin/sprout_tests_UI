name: sprout_tests_UI

# Определение события, запускающего workflow
on: 
  workflow_dispatch:
    inputs:
      url:
        description: 'Стенд: https://sprout-store.ru (прод) или https://new.sprout-store.ru (стейдж)'
        required: false
        default: 'https://sprout-store.ru'
      pytest_args:
        description: 'Доп. аргументы pytest, напр. tests/test_autorization.py или -k test_name'
        required: false
        default: ''
      publish_report:
        description: 'Публиковать Allure-отчет на GitHub Pages (выключать для отладочных прогонов на стейдже: трейс содержит заголовки авторизации)'
        type: boolean
        default: true
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]
  schedule:
    # - cron: '0 5 * * *'   
    - cron: '0 6 * * *'

# Определение Задачи(job)
jobs:
  # Основная часть тестов
  tests:
    timeout-minutes: 120

    # Уникальный ключ для группы задач предназначен для того, чтобы повторный запуск Джобы вставал в ожидание, не конфликтуая с первым
    concurrency:
      group: sprout_tests_UI_concurrency
      cancel-in-progress: false

    # запуск на виртуальной машине
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '0 5 * * *' || github.event.schedule == '0 6 * * *'))
    runs-on: ubuntu-latest
    env:
      ADMIN_BUYER_EMAIL: ${{ secrets.ADMIN_BUYER_EMAIL }}
      ADMIN_BUYER_PASSWORD: ${{ secrets.ADMIN_BUYER_PASSWORD }}
      TEST_BUYER_EMAIL: ${{ secrets.TEST_BUYER_EMAIL }}
      TEST_BUYER_PASSWORD: ${{ secrets.TEST_BUYER_PASSWORD }}
      ADMIN_SELLER_EMAIL: ${{ secrets.ADMIN_SELLER_EMAIL }}
      ADMIN_SELLER_PASSWORD: ${{ secrets.ADMIN_SELLER_PASSWORD }}
      PURCHASER_EMAIL: ${{ secrets.PURCHASER_EMAIL }}
      PURCHASER_PASSWORD: ${{ secrets.PURCHASER_PASSWORD }}
      CONTRACT_MANAGER_EMAIL: ${{ secrets.CONTRACT_MANAGER_EMAIL }}
      CONTRACT_MANAGER_PASSWORD: ${{ secrets.CONTRACT_MANAGER_PASSWORD }}
      TESTMAIL_ADRESS_: ${{ secrets.TESTMAIL_ADRESS_ }}
      TESTMAIL_JSON_: ${{ secrets.TESTMAIL_JSON_ }}
      ADMIN_BUYER_LIMIT_EMAIL: ${{ secrets.ADMIN_BUYER_LIMIT_EMAIL }}
      ADMIN_BUYER_LIMIT_PASSWORD: ${{ secrets.ADMIN_BUYER_LIMIT_PASSWORD }}
      WITHOUT_ROLE_MANAGER_EMAIL: ${{ secrets.WITHOUT_ROLE_MANAGER_EMAIL }}
      WITHOUT_ROLE_MANAGER_PASSWORD: ${{ secrets.WITHOUT_ROLE_MANAGER_PASSWORD }}
      MANAGER_FOR_CONTRACT_EMAIL: ${{ secrets.MANAGER_FOR_CONTRACT_EMAIL }}
      MANAGER_FOR_CONTRACT_PASSWORD: ${{ secrets.MANAGER_FOR_CONTRACT_PASSWORD }}

      PROXY_HOST: ${{ secrets.PROXY_HOST}}
      PROXY_PORT: ${{ secrets.PROXY_PORT}}
      PROXY_USER: ${{ secrets.PROXY_USER}}
      PROXY_PASS: ${{ secrets.PROXY_PASS}}
      # HTTP Basic Auth превью-стенда (используется только если сервер её запрашивает)
      PREVIEW_USER: ${{ secrets.PREVIEW_USER }}
      PREVIEW_PASS: ${{ secrets.PREVIEW_PASS }}

    steps:

      # Клонирование репозитория
      - uses: actions/checkout@v4

      # Установка Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.1'

      # Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Показать cwd и содержимое директории проекта
        run: |
          pwd
          ls -l
          ls -l auth_states || echo "auth_states пока нет"

      # Установка браузеров
      - name: Ensure browsers are installed
        run: python -m playwright install --with-deps

      # Preflight: проверка доступа к стенду до запуска тестов — падает сразу, если не проходит Basic Auth превью
      - name: Preflight stage access
        env:
          TARGET_URL: ${{ inputs.url || 'https://sprout-store.ru' }}
        run: |
          echo "PREVIEW_USER set: $([ -n "$PREVIEW_USER" ] && echo yes || echo NO), PREVIEW_PASS set: $([ -n "$PREVIEW_PASS" ] && echo yes || echo NO)"
          code_noauth=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TARGET_URL/login" || true)
          echo "Без авторизации: $code_noauth"
          if [ "$code_noauth" != "401" ]; then echo "Basic Auth не требуется"; exit 0; fi
          code_direct=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -u "$PREVIEW_USER:$PREVIEW_PASS" "$TARGET_URL/login" || true)
          echo "С PREVIEW_* напрямую: $code_direct"
          if [ -n "$PROXY_HOST" ]; then
            code_proxy=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -x "http://$PROXY_HOST:$PROXY_PORT" --proxy-user "$PROXY_USER:$PROXY_PASS" -u "$PREVIEW_USER:$PREVIEW_PASS" "$TARGET_URL/login" || true)
            echo "С PREVIEW_* через прокси: $code_proxy"
          fi
          if [ "$code_direct" = "401" ]; then echo "::error::PREVIEW_USER/PREVIEW_PASS не подходят к $TARGET_URL"; exit 1; fi

      # TEMP DEBUG: проверка http_credentials в Playwright (удалить после отладки)
      - name: Debug Playwright preview auth
        if: contains(inputs.pytest_args, 'test_autorization')
        env:
          TARGET_URL: ${{ inputs.url || 'https://sprout-store.ru' }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          from playwright.sync_api import sync_playwright
          u = os.environ['TARGET_URL'].rstrip('/')
          c = {'username': os.environ['PREVIEW_USER'], 'password': os.environ['PREVIEW_PASS']}
          px = {'server': 'http://%s:%s' % (os.environ['PROXY_HOST'], os.environ['PROXY_PORT']), 'username': os.environ['PROXY_USER'], 'password': os.environ['PROXY_PASS']}
          print('playwright', version('playwright'))
          cases = [('no proxy', {}, c), ('no proxy + origin', {}, dict(c, origin=u)), ('proxy', {'proxy': px}, c), ('proxy + origin', {'proxy': px}, dict(c, origin=u))]
          with sync_playwright() as p:
              for name, launch, cred in cases:
                  try:
                      b = p.chromium.launch(**launch)
                      r = b.new_context(http_credentials=cred).new_page().goto(u + '/login')
                      print(name, '->', r.status if r else None)
                      b.close()
                  except Exception as e:
                      print(name, '-> ERR', str(e)[:300])
          PY

      # Запуск тестов
      - name: Run tests
        env:
          # По расписанию inputs пустые -> прод
          TARGET_URL: ${{ inputs.url || 'https://sprout-store.ru' }}
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: |
          # pytest --reruns 2 --reruns-delay 3 --alluredir=allure-results --tb=short -v
          pytest --reruns 1 --reruns-delay 3 --alluredir=allure-results --tb=short -v --url "$TARGET_URL" $PYTEST_ARGS

      - name: Показать содержимое auth_states после тестов
        if: always()
        run: |
          echo "::group::Содержимое папки auth_states"
          ls -l auth_states || echo "Папка auth_states не создана"
          find . -type f -name '*.json'
          echo "::endgroup::"

      - name: Показать размеры storage_state файлов
        if: always()
        run: |
          echo "::group::Размеры файлов auth_states"
          if [ -d auth_states ]; then
            for f in auth_states/*.json; do
              echo "$(stat -c '%12s %n' "$f")"
            done
          else
            echo "Папки auth_states нет"
          fi
          echo "::endgroup::"

      - name: Показать первые строки каждого storage_state
        if: always()
        run: |
          echo "::group::Первые строки storage_state файлов"
          if [ -d auth_states ]; then
            for f in auth_states/*.json; do
              echo "==== $f ===="
              head -20 "$f"
              echo ""
            done
          else
            echo "Папки auth_states нет"
          fi
          echo "::endgroup::"
          
      # Проверка наличия json-файлов в allure-results (чтобы не запушить сломаный отчет)
      - name: Check if Allure results exist
        if: always()
        id: check_allure
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results/*.json 2>/dev/null)" ]; then
            echo "allure_results_exist=true" >> $GITHUB_OUTPUT
          else
            echo "allure_results_exist=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Debug allure_results_exist
        if: always()
        run: echo "allure_results_exist=${{ steps.check_allure.outputs.allure_results_exist }}"

      # Загрузка артефактов
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        with:
          name: allure-results-main-${{ github.run_id }}
          path: allure-results/
          # retention_days: 10

      # Получение истории прогонов Allure
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Генерация отчета с учетом истории прогонов (Allure CLI без Docker:
      # simple-elf/allure-report-action тянул базовый образ из public.ecr.aws и падал на 429 rate limit)
      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        env:
          ALLURE_VERSION: '2.44.0'
        run: |
          wget -q -O /tmp/allure.tgz "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz"
          tar -xzf /tmp/allure.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        id: allure-report
        env:
          KEEP_REPORTS: 15
          RUN_NUM: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          PAGES_URL="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p gh-pages allure-history
          cp -r gh-pages/. allure-history/

          # Оставляем последние KEEP_REPORTS отчетов
          COUNT=$(ls allure-history | wc -l)
          KEEP=$((KEEP_REPORTS + 1))
          if (( COUNT > KEEP )); then
            (cd allure-history && rm -rf index.html last-history && ls | sort -n | grep -v CNAME | head -n -$((KEEP - 2)) | xargs -r rm -rf)
          fi

          # Редирект на свежий отчет
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; URL=%s/%s/index.html">\n<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">\n' "$PAGES_URL" "$RUN_NUM" > allure-history/index.html

          # Executor-виджет
          printf '{"name":"GitHub Actions","type":"github","reportName":"Allure Report with history","url":"%s","reportUrl":"%s/%s","buildUrl":"%s/%s/actions/runs/%s","buildName":"GitHub Actions Run #%s","buildOrder":"%s"}\n' \
            "$PAGES_URL" "$PAGES_URL" "$RUN_NUM" "$SERVER_URL" "$GITHUB_REPOSITORY" "$RUN_ID" "$RUN_ID" "$RUN_NUM" > allure-results/executor.json

          # История трендов
          if [ -d gh-pages/last-history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/last-history/. allure-results/history/
          fi

          allure generate --clean allure-results -o allure-report

          mkdir -p "allure-history/${RUN_NUM}" allure-history/last-history
          cp -r allure-report/. "allure-history/${RUN_NUM}/"
          cp -r allure-report/history/. allure-history/last-history/

      # Публикация отчета Allure  
      - name: Publish Allure report
        uses: peaceiris/actions-gh-pages@v4
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_report)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true
          
  notify-on-failure:
    if: |
      failure() ||
      (needs.tests && needs.tests.result != 'success' && needs.tests.result != 'skipped')
    runs-on: ubuntu-latest
    # needs: tests
    needs: [tests]
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ GitHub Actions FAILED in ${{ github.repository }}"
          body: |
           ❗ Workflow [${{ github.workflow }}] failed.

            🔗 View it here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            📦 Commit: ${{ github.sha }}
            👤 Triggered by: ${{ github.actor }}
          to: urin.a@garagetools.ru, timofeev.a@garagetools.ru
          from: GitHub Actions <${{ secrets.GMAIL_USERNAME }}>
